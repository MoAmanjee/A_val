name: Publish site

on:
  push:
    branches:
      - main
      - cursor/whatsapp-agent-portfolio-42cd
    paths:
      - "index.html"
      - "privacy.html"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble public site
        run: |
          mkdir -p _site/assets
          cp index.html privacy.html _site/
          cp assets/logo.png assets/favicon.png assets/styles.css assets/site.js assets/config.js _site/assets/
          printf '' > _site/.nojekyll
          test ! -e _site/willubev.html
          find _site -type f -print

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Check Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not switched on yet. Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          fi

      - name: Deploy
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
