name: Publish site

on:
  push:
    branches:
      - main
      - cursor/whatsapp-agent-portfolio-42cd
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble public site
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/logo.png assets/favicon.png assets/styles.css assets/site.js _site/assets/
          printf '' > _site/.nojekyll
          test ! -e _site/willubev.html
          find _site -type f -print

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
