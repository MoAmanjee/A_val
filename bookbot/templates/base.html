<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BookBot{% endblock %}</title>
<style>
  :root { --brand:#0b8f5a; --ink:#16212b; --muted:#5b6b78; --bg:#f5f8f7; --card:#fff; --line:#dfe7e4; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
  a { color:var(--brand); }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px; }
  nav { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); }
  nav .logo { font-weight:800; font-size:1.2rem; color:var(--brand); text-decoration:none; }
  nav form { display:inline; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:18px; }
  h1 { font-size:2rem; line-height:1.2; margin:0 0 12px; } h2 { margin-top:0; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:1rem; background:#fff; }
  button, .btn { display:inline-block; background:var(--brand); color:#fff; border:0; border-radius:8px; padding:11px 20px; font-size:1rem; font-weight:700; cursor:pointer; text-decoration:none; margin-top:14px; }
  button.link { background:none; color:var(--brand); padding:0; margin:0; font-weight:600; }
  button.danger { background:#c0392b; padding:6px 12px; margin:0; font-size:.85rem; }
  .flash { background:#fff4d6; border:1px solid #f0d37a; padding:10px 14px; border-radius:8px; margin-bottom:14px; }
  .muted { color:var(--muted); } table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  .row { display:flex; gap:12px; flex-wrap:wrap; } .row > * { flex:1 1 140px; }
  .slots button { margin:4px 4px 0 0; padding:8px 14px; background:#fff; color:var(--brand); border:1px solid var(--brand); }
  .slots button.sel { background:var(--brand); color:#fff; }
  .hero { text-align:center; padding:40px 0 20px; } .hero p { font-size:1.15rem; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  .price { font-size:2.4rem; font-weight:800; color:var(--brand); }
</style>
</head>
<body>
<nav>
  <a class="logo" href="{{ url_for('landing') }}">BookBot</a>
  <div>
    {% if session.get('biz_id') %}
      <a href="{{ url_for('dashboard') }}">Dashboard</a> &nbsp;
      <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="link">Log out</button></form>
    {% else %}
      <a href="{{ url_for('login') }}">Log in</a>
    {% endif %}
  </div>
</nav>
<div class="wrap">
  {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
