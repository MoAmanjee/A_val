{% extends "base.html" %}
{% block title %}Sign up - BookBot{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:auto">
  <h2>Create your booking page</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Business name</label><input name="name" required>
    <label>Your email</label><input type="email" name="email" required>
    <label>Business WhatsApp number</label><input name="whatsapp" placeholder="082 123 4567" required>
    <label>Password (8+ characters)</label><input type="password" name="password" minlength="8" required>
    <button>Create account</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
