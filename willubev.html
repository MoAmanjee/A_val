<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet"> <!-- Bubbly Font -->
    <style>
        body {
            text-align: center;
            font-family: 'Poppins', sans-serif; /* Applying the bubble font */
            background-color: #8B0000; /* Dark blood red background */
            background-image: url('https://i0.wp.com/picjumbo.com/wp-content/uploads/colorful-love-hearts-wallpaper-free-photo.jpg?w=2210&quality=70');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        h1 {
            margin-top: 20vh;
            font-size: 4rem;
            font-weight: bold;
            color: #ff0000; /* Red fill color */
            text-shadow: 
                2px 2px 0 white,  
                -2px -2px 0 white,
                2px -2px 0 white,
                -2px 2px 0 white; /* White outline effect */
            padding: 10px 20px;
            border-radius: 15px;
            letter-spacing: 3px;
            display: inline-block;
            line-height: 1.2;
        }
        .btn-container {
            margin-top: 30px;
        }
        .btn {
            padding: 15px 30px;
            font-size: 1.5rem;
            border: none;
            cursor: pointer;
            border-radius: 10px;
        }
        .yes {
            background-color: green;
            color: white;
        }
        .no {
            background-color: red;
            color: white;
            position: absolute;
        }
        .teddy-bear-gif {
            position: absolute;
            bottom: 20px;
            width: 200px;
        }
    </style>
    <script>
        function moveNoButton() {
            let noButton = document.getElementById("no");
            let x = Math.random() * (window.innerWidth - 100);
            let y = Math.random() * (window.innerHeight - 50);
            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
        }

        // Redirect to YES page
        function goToYesPage() {
            document.body.innerHTML = `
                <style>
                    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap');
                    body {
                        background: url('https://ew.com/thmb/2aY-4LuFt3AbcK7rq8VcmtXmG2E=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/fifty-shades-red-room-bb2ac1ae5763417b95d1a9cd0805f4a5.jpg') no-repeat center center fixed;
                        background-size: cover;
                        color: #f1c40f;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        height: 100vh;
                        flex-direction: column;
                        text-align: center;
                        font-family: 'Roboto', sans-serif;
                    }
                    h1 {
                        font-size: 3.5rem;
                        text-shadow: 2px 2px 10px black;
                        color: #f1c40f;
                    }
                </style>
                <h1>YES! Now you have to come to me so i can FUCKKKK your brains out! ❤️❤️❤️❤️❤️</h1>
            `;
        }
    </script>
</head>
<body>
    <h1>AAMINA Will you be my Valentine? 💘</h1>
    <div class="btn-container">
        <button class="btn yes" onclick="goToYesPage()">YES</button>
        <button class="btn no" id="no" onmouseover="moveNoButton()">NO</button>
    </div>
    <img class="teddy-bear-gif" src="https://media.tenor.com/sdCT4mf8XZMAAAAM/i-love-you-love.gif" alt="Teddy Bear Love">
</body>
</html>
